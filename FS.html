<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Myntra | Online Fashion Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        /* Header */
        header {
            background-color: #ffffff;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            color: #ff3f6c;
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        nav a:hover {
            color: #ff3f6c;
        }

        /* Banner */
        .banner {
            background: linear-gradient(to right, #ff3f6c, #ff7a18);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .banner p {
            font-size: 18px;
        }

        /* Products */
        .container {
            padding: 40px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .card h3 {
            margin: 10px 0 5px;
            font-size: 18px;
        }

        .price {
            color: #ff3f6c;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: #ccc;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
